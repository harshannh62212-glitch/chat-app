version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chat_app_db
    restart: always
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: secure_password_change_me
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=128MB", "-c", "work_mem=8MB", "-c", "effective_cache_size=4GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat_network

  backend:
    build: .
    container_name: chat_app_backend
    restart: always
    user: root
    privileged: true
    security_opt:
      - apparmor:unconfined
    environment:
      DATABASE_URL: postgresql://chat_user:secure_password_change_me@postgres:5432/chat_db
      JWT_SECRET: your_jwt_secret_change_in_production
      PORT: 8000
      NODE_ENV: production
      CLIENT_URL: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chat_network
    volumes:
      - .:/app
      - /app/node_modules
      - /sys:/sys

volumes:
  postgres_data:

networks:
  chat_network:
    driver: bridge

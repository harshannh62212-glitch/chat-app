version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chat_app_db
    restart: always
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: secure_password_change_me
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=3GB", "-c", "work_mem=64MB", "-c", "effective_cache_size=8GB", "-c", "maintenance_work_mem=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat_network

  backend:
    build: .
    container_name: chat_app_backend
    restart: always
    user: root
    privileged: true
    security_opt:
      - apparmor:unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      DATABASE_URL: postgresql://chat_user:secure_password_change_me@postgres:5432/chat_db
      JWT_SECRET: your_jwt_secret_change_in_production
      PORT: 8000
      NODE_ENV: production
      CLIENT_URL: "*"
      UV_THREADPOOL_SIZE: 16
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: "--max-old-space-size=2048"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - chat_network
    volumes:
      - .:/app
      - /app/node_modules
      - /sys:/sys

  redis:
    image: redis:7-alpine
    container_name: chat_app_redis
    restart: always
    command: redis-server --maxclients 10000 --save ""
    ports:
      - "6379:6379"
    networks:
      - chat_network
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run chat-app
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - chat_network
volumes:
  postgres_data:

networks:
  chat_network:
    driver: bridge

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Status</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #fff;
      transition: background-color 0.5s ease;
    }
    h1 { font-size: 2.5rem; }
  </style>
</head>
<body>
  <h1 id="msg">Checking…</h1>
  <script>
    // Simple health check – if the endpoint resolves with status ok, show green; otherwise red
    fetch('/api/health')
      .then(res => {
        if (!res.ok) throw new Error('Network error');
        return res.json();
      })
      .then(data => {
        if (data.status === 'ok') {
          document.body.style.backgroundColor = '#28a745'; // green
          document.getElementById('msg').textContent = '✅ Server is UP';
        } else {
          throw new Error('Unexpected status');
        }
      })
      .catch(() => {
        document.body.style.backgroundColor = '#dc3545'; // red
        document.getElementById('msg').textContent = '❌ Server DOWN';
      });
  </script>
</body>
</html>
